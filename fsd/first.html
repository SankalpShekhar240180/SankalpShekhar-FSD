<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    function rollnumber(num, delay, next) {
    setTimeout(() => {
      console.log("Roll number is ", num);
      if (next) next();
    }, delay);
  }
  
  rollnumber(101, 2000, () => {
    rollnumber(102, 2000, () => {
      rollnumber(103, 2000, () => {
        rollnumber(104, 2000);
      });
    });
  });
  </script>
</body>
</html>
